          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertUpdateRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
