          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAlertUpdateRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_200_Alert'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest_AlertUpdate'
          description: HTTP 400 Error
        '401':
          content:
