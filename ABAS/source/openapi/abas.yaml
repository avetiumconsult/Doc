          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_200_Alert'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest_AlertUpdate'
          description: HTTP 400 Error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError_401_Response'
          description: HTTP 401 Client Error
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError_403_Response'
          description: HTTP 403 Client Error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError_404_Response'
          description: HTTP 404 Client Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError_500_Response'
          description: HTTP 500 Server Error
