openapi: 3.0.3
info:
  title: Avetium Backup Archiving Solution APIs
  version: 1.0.0 (v1)
  description: "\n    Avetium Backup Archiving Solution REST API.\n    \n    ## Authentication\n\
    \    \n    Protected endpoints require a valid JWT access token.\n    \n    Use\
    \ the **Authorize** button in Swagger UI and paste **only the JWT token**.\n \
    \   Swagger UI automatically prefixes it with `Bearer` when sending requests.\n\
    \    "
paths:
  /api/v1/alerts/all/:
    get:
      operationId: api_v1_alerts_all_list
      description: "\n    Returns all the alert notifications of a user with a role\
        \ in an organization.\n    Allows to list, search and filter all alert notifications.\n\
        \n    ### Request Headers:\n      - `Authorization: Bearer <access_token>`\n\
        \    "
      summary: View, search and filter all the alert notifications
      parameters:
      - in: query
        name: alert_id
        schema:
          type: string
      - in: query
        name: alert_type
        schema:
          type: integer
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at_after
        schema:
          type: string
          format: date
      - in: query
        name: created_at_before
        schema:
          type: string
          format: date
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
      - in: query
        name: updated_at_after
        schema:
          type: string
          format: date
      - in: query
        name: updated_at_before
        schema:
          type: string
          format: date
      tags:
      - Alert Notification Endpoints
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSuccessResponse_200_AlertList'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest_Alert'
          description: HTTP 400 Error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError_401_Response'
          description: HTTP 401 Client Error
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError_403_Response'
          description: HTTP 403 Client Error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError_404_Response'
          description: HTTP 404 Client Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError_500_Response'
          description: HTTP 500 Server Error
  /api/v1/alerts/detail/{alert_id}/:
